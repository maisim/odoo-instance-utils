default:
  image: python:3.12-slim

stages:
  - quality
  - test
  - publish

variables:
  UV_CACHE_DIR: .uv-cache

.install: &install
  before_script:
    - pip install uv --quiet
    - uv sync --group dev
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .uv-cache/

.on-mr-and-main:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"

lint:
  extends: .on-mr-and-main
  stage: quality
  <<: *install
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  extends: .on-mr-and-main
  stage: quality
  <<: *install
  script:
    - uv run mypy odoo_instance_utils/

test:
  extends: .on-mr-and-main
  stage: test
  <<: *install
  script:
    - uv run pytest tests/ -v

publish:
  stage: publish
  before_script:
    - pip install uv --quiet
  script:
    - uv build
    - uv publish
        --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
        --username gitlab-ci-token
        --password "${CI_JOB_TOKEN}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/
