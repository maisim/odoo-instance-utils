image: python:3.12

stages:
  - quality
  - test
  - release

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  UV_PUBLISH_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"  
  UV_PUBLISH_USERNAME: "gitlab-ci-token"  
  UV_PUBLISH_PASSWORD: "${CI_JOB_TOKEN}"

.install: &install
  before_script:
    - pip install uv
    - uv sync --group dev
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths:
      - .uv-cache/

.on-mr-and-main:
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"

lint:
  extends: .on-mr-and-main
  stage: quality
  tags: [docker]
  <<: *install
  script:
    - uv run pre-commit run --all-files

test:
  extends: .on-mr-and-main
  stage: test
  tags: [docker]
  <<: *install
  script:
    - uv run pytest tests/ -v

release:
  stage: release
  tags: [docker]
  variables:
    GIT_DEPTH: 0
  before_script:
    - pip install uv
    - uv sync --group dev
    - git config user.email "gitlab-ci@${CI_SERVER_HOST}"
    - git config user.name "GitLab CI"
    - git remote set-url origin "https://gitlab-ci-token:${GL_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    # Bump version if conventional commits warrant it
    - NEW_VERSION=$(uv run semantic-release version --print 2>/dev/null || true)
    - |
      if [ -n "$NEW_VERSION" ]; then
        echo "Releasing version $NEW_VERSION"
        uv run semantic-release version --push
      else
        echo "No version bump warranted, publishing current version."
      fi
    # Always build and publish to GitLab PyPI registry
    - uv build
    - uv publish dist/* \
        --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
        --username gitlab-ci-token \
        --password "${CI_JOB_TOKEN}"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
