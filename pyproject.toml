[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-instance-utils"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
cli = [
    "click",
    "click-odoo",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
odoo-instance = "odoo_instance_utils.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_instance_utils*"]
