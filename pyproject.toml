[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-instance-utils"
dynamic = ["version"]
description = "CLI utilities for auditing and managing Odoo instances"
readme = "README.md"
license = "MIT"
authors = [{ name = "Simon Maillard", email = "simon@ogesta.fr" }]
requires-python = ">=3.7"
dependencies = [
    "pyyaml",
]

[project.urls]
homepage = "https://github.com/maisim/odoo-instance-utils"
repository = "https://github.com/maisim/odoo-instance-utils"

[project.optional-dependencies]
cli = [
    "click",
    "click-odoo",
]

[project.scripts]
odoo-instance = "odoo_instance_utils.cli.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "scm"
update_changelog_on_bump = true
major_version_zero = true
[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_instance_utils*"]

[tool.setuptools_scm]

