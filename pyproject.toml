[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-instance-utils"
version = "0.1.0"
description = "CLI utilities for auditing and managing Odoo instances"
readme = "README.md"
license = "MIT"
authors = [{ name = "Simon Maillard", email = "simon@ogesta.fr" }]
requires-python = ">=3.8"
dependencies = [
    "pyyaml",
]

[project.urls]
homepage = "https://gitlab.ogesta.fr/simon/odoo-instance-utils"
repository = "https://gitlab.ogesta.fr/simon/odoo-instance-utils"

[project.optional-dependencies]
cli = [
    "click",
    "click-odoo",
]

[dependency-groups]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
odoo-instance = "odoo_instance_utils.cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_instance_utils*"]
